<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080412">
  <meta name="color-scheme" content="dark">
  <title>Двойной ДР — приглашение</title>
  <meta name="description" content="Большой дом, два именинника и одна вечеринка. Все детали внутри.">
  <meta property="og:title" content="Двойной ДР — приглашение">
  <meta property="og:description" content="Большой дом, два именинника и одна вечеринка.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">

  <!-- Шрифты: Unbounded + Inter (тема 1), Manrope (тема 2), JetBrains Mono (цифры и статусы) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind и Lucide грузятся с defer и не задерживают первый экран -->
  <script defer src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>

  <style>
    /* ─────────── Регистрируем цвета градиента, чтобы он плавно перетекал между темами ─────────── */
    @property --btn-a { syntax: '<color>'; inherits: true; initial-value: #7C3AED; }
    @property --btn-b { syntax: '<color>'; inherits: true; initial-value: #D946EF; }
    @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

    :root {
      --morph: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      --portrait-w: clamp(66px, 22vw, 96px);
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* ─────────── ТЕМА 1 · UV Rave ─────────── */
    body[data-theme="1"] {
      --bg-page: #080412;
      --bg-outer: #040209;
      --bg-card: rgba(20, 10, 42, 0.74);
      --bg-inset: rgba(255, 255, 255, 0.055);
      --bg-sheet: #150B2B;
      --bg-seg: rgba(17, 8, 36, 0.86);
      --bg-tile: rgba(217, 70, 239, 0.14);
      --border-card: rgba(217, 70, 239, 0.32);
      --border-soft: rgba(205, 170, 255, 0.16);
      --accent: #D946EF;
      --accent-secondary: #7C3AED;
      --accent-tertiary: #06B6D4;
      --accent-text: #F0ABFC;
      --glow-color: rgba(217, 70, 239, 0.30);
      --glow-size: 34px;
      --card-hi: rgba(255, 255, 255, 0.07);
      --card-radius: 24px;
      --radius-sm: 16px;
      --radius-btn: 16px;
      --radius-pill: 999px;
      --radius-seg: 22px;
      --dot-radius: 6px;
      --card-blur: 16px;
      --avatar-radius: 22%;
      --frame-outer: 10px;
      --frame-inner: 6px;
      --frame-bg: linear-gradient(160deg, #F0ABFC 0%, #D946EF 35%, #7C3AED 70%, #06B6D4 100%);
      --frame-glow: 0 0 26px -4px rgba(217, 70, 239, 0.65);
      --portrait-fill: radial-gradient(120% 95% at 50% 105%, #E879F9 0%, #7C3AED 48%, #1B0B36 100%);
      --photo-filter: grayscale(1) sepia(1) hue-rotate(222deg) saturate(2.3) contrast(1.1) brightness(1.12);
      --shine: rgba(245, 208, 254, 0.95);
      --font-heading: 'Unbounded', 'Inter', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --h-weight: 700;
      --t-weight: 500;
      --h-tracking: -0.01em;
      --h1-size: clamp(28px, 9.6vw, 44px);
      --h2-size: 21px;
      --h3-size: 16px;
      --text: #F6EFFF;
      --text-muted: #BBAAD8;
      --btn-a: #7C3AED;
      --btn-b: #D946EF;
      --btn-text: #FFFFFF;
      --btn-glow: rgba(217, 70, 239, 0.55);
      --rave-on: 1;
      --pattern-opacity: 0.09;
      --gold-on: 0;
    }

    /* ─────────── ТЕМА 2 · Dark Gold Keynote ─────────── */
    body[data-theme="2"] {
      --bg-page: #09090B;
      --bg-outer: #050506;
      --bg-card: #141417;
      --bg-inset: #1B1B1F;
      --bg-sheet: #141417;
      --bg-seg: rgba(20, 20, 23, 0.94);
      --bg-tile: rgba(212, 175, 55, 0.10);
      --border-card: rgba(212, 175, 55, 0.28);
      --border-soft: rgba(255, 255, 255, 0.09);
      --accent: #D4AF37;
      --accent-secondary: #F59E0B;
      --accent-tertiary: #F3E5B5;
      --accent-text: #E7CB73;
      --glow-color: rgba(212, 175, 55, 0.10);
      --glow-size: 0px;
      --card-hi: rgba(255, 255, 255, 0.05);
      --card-radius: 12px;
      --radius-sm: 8px;
      --radius-btn: 10px;
      --radius-pill: 6px;
      --radius-seg: 12px;
      --dot-radius: 2px;
      --card-blur: 0px;
      --avatar-radius: 22%;
      --frame-outer: 10px;
      --frame-inner: 6px;
      --frame-bg: linear-gradient(145deg, #F3E5B5 0%, #B8902C 30%, #F0DC9A 55%, #7A5C17 80%, #D4AF37 100%);
      --frame-glow: 0 14px 30px -14px rgba(212, 175, 55, 0.55);
      --portrait-fill: radial-gradient(120% 95% at 50% -5%, #8A6C1E 0%, #33290F 46%, #141417 100%);
      --photo-filter: grayscale(1) sepia(0.32) hue-rotate(0deg) saturate(1.15) contrast(1.12) brightness(1.04);
      --shine: rgba(243, 229, 181, 0.95);
      --font-heading: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --h-weight: 800;
      --t-weight: 700;
      --h-tracking: -0.035em;
      --h1-size: clamp(34px, 11.5vw, 56px);
      --h2-size: 27px;
      --h3-size: 18px;
      --text: #F5F2EA;
      --text-muted: #A6A199;
      --btn-a: #F0DC9A;
      --btn-b: #D4AF37;
      --btn-text: #15110A;
      --btn-glow: rgba(212, 175, 55, 0.30);
      --rave-on: 0;
      --pattern-opacity: 0;
      --gold-on: 1;
    }

    /* ─────────── База ─────────── */
    *, *::before, *::after { box-sizing: border-box; border: 0 solid transparent; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: #050308; color-scheme: dark; }
    html.modal-open { overflow: hidden; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      font-family: var(--font-body); font-size: 16px; line-height: 1.5;
      color: var(--text); background-color: var(--bg-outer);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      transition: background-color var(--morph), color var(--morph);
    }
    h1, h2, h3, h4, p, dl, dd, ol, ul, figure, fieldset { margin: 0; }
    h1, h2, h3, h4 { font-size: inherit; font-weight: inherit; }
    ol, ul { list-style: none; padding: 0; }
    fieldset { padding: 0; min-width: 0; }
    legend { padding: 0; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; margin: 0; }
    button { background: none; padding: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
    img, svg { display: block; max-width: 100%; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent-tertiary); outline-offset: 3px; }
    ::selection { background: var(--accent); color: var(--btn-text); }

    /* ─────────── Сцена: фон обеих тем живёт в одном слое и перетекает по opacity ─────────── */
    .scene {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden; pointer-events: none;
      background-color: var(--bg-page);
      transition: background-color 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene > div { position: absolute; inset: 0; transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
    .scene-rave { opacity: var(--rave-on); }
    .blob { position: absolute; aspect-ratio: 1; border-radius: 50%; will-change: transform, opacity; animation: breathe 13s ease-in-out infinite alternate; }
    .blob-1 { width: 135vmin; top: -24%; left: calc(50% - 97.5vmin); background: radial-gradient(circle, rgba(124, 58, 237, 0.72) 0%, rgba(124, 58, 237, 0) 62%); }
    .blob-2 { width: 120vmin; top: 30%; left: calc(50% - 12vmin); background: radial-gradient(circle, rgba(217, 70, 239, 0.46) 0%, rgba(217, 70, 239, 0) 62%); animation-duration: 17s; animation-delay: -6s; }
    .blob-3 { width: 80vmin; bottom: -12%; left: calc(50% - 76vmin); background: radial-gradient(circle, rgba(6, 182, 212, 0.26) 0%, rgba(6, 182, 212, 0) 62%); animation-duration: 21s; animation-delay: -11s; }
    @keyframes breathe {
      from { transform: translate3d(0, 0, 0) scale(0.88); opacity: 0.55; }
      to   { transform: translate3d(5%, 4%, 0) scale(1.14); opacity: 1; }
    }
    .scene-pattern { opacity: var(--pattern-opacity); color: #F5D0FE; }
    .pattern-grid { position: absolute; inset: 0; width: 100%; height: 100%; }
    .rosette { position: absolute; width: 420px; height: 420px; max-width: none; animation: spin 180s linear infinite; }
    .rosette-a { top: -110px; right: -170px; }
    .rosette-b { bottom: -150px; left: -190px; animation-direction: reverse; animation-duration: 240s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scene-gold {
      opacity: var(--gold-on);
      background:
        radial-gradient(ellipse min(90vw, 760px) 46% at 50% -6%, rgba(212, 175, 55, 0.27), rgba(212, 175, 55, 0.07) 46%, transparent 72%),
        radial-gradient(ellipse min(70vw, 620px) 26% at 50% 106%, rgba(245, 158, 11, 0.08), transparent 70%);
    }
    .gold-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(240, 220, 154, 0.085) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 220, 154, 0.085) 1px, transparent 1px);
      background-size: 40px 40px; background-position: center -1px;
      -webkit-mask-image: radial-gradient(ellipse min(95vw, 820px) 62% at 50% 0%, #000 0%, rgba(0, 0, 0, 0.35) 45%, transparent 78%);
      mask-image: radial-gradient(ellipse min(95vw, 820px) 62% at 50% 0%, #000 0%, rgba(0, 0, 0, 0.35) 45%, transparent 78%);
    }
    .gold-beams {
      position: absolute; inset: 0; mix-blend-mode: screen;
      background:
        linear-gradient(104deg, transparent 38%, rgba(240, 220, 154, 0.07) 46%, transparent 54%),
        linear-gradient(76deg, transparent 46%, rgba(240, 220, 154, 0.05) 54%, transparent 62%);
      -webkit-mask-image: linear-gradient(#000, transparent 75%);
      mask-image: linear-gradient(#000, transparent 75%);
      animation: beams 11s ease-in-out infinite alternate;
    }
    @keyframes beams { from { opacity: 0.55; } to { opacity: 1; } }
    .scene-gold::before { content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px; background: linear-gradient(90deg, transparent, rgba(240, 220, 154, 0.75), transparent); }

    /* Появление блоков при прокрутке + блик, пробегающий по рамке карточки */
    .rv { opacity: 0; }
    .rv.rv-in { animation: rv-in 0.75s cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: var(--rv-d, 0ms); }
    @keyframes rv-in { from { opacity: 0; transform: translateY(26px) scale(0.985); } to { opacity: 1; transform: none; } }
    .card { position: relative; }
    .card::after {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none; opacity: 0;
      background: linear-gradient(115deg, transparent 36%, var(--shine) 50%, transparent 64%) 130% 0 / 260% 100% no-repeat;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .card.shine::after { animation: shine 1.3s ease-out both; animation-delay: calc(var(--rv-d, 0ms) + 200ms); }
    @keyframes shine { 0% { opacity: 0; background-position: 130% 0; } 18% { opacity: 1; } 100% { opacity: 0; background-position: -30% 0; } }

    /* большая кнопка «Что-то своё» */
    .own-btn {
      position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; margin-top: 16px; padding: 14px 16px;
      border-radius: var(--radius-btn); background-color: var(--bg-inset); color: var(--text); text-align: left;
      transition: transform 0.15s ease, background-color var(--morph), color var(--morph), border-radius var(--morph), box-shadow var(--morph), --btn-a var(--morph), --btn-b var(--morph);
    }
    .own-btn:active { transform: scale(0.98); }
    .own-btn::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
      background: conic-gradient(from var(--ang), var(--accent), var(--accent-tertiary), var(--accent-secondary), var(--accent));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .own-ico { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: calc(var(--radius-sm) * 0.75); background-color: var(--bg-tile); color: var(--accent-text); transition: background-color var(--morph), color var(--morph), border-radius var(--morph); }
    .own-ico i, .own-ico svg { width: 22px; height: 22px; }
    .own-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .own-main { font-family: var(--font-heading); font-weight: var(--h-weight); font-size: 17px; letter-spacing: var(--h-tracking); line-height: 1.2; }
    .own-sub { font-size: 12px; line-height: 1.3; color: var(--text-muted); transition: color var(--morph); }
    .own-btn.is-armed { animation: uni-arm 0.9s ease-in-out infinite; }
    .own-btn.is-armed .own-sub { color: var(--accent-text); }
    .own-btn.is-picked { background-image: linear-gradient(120deg, var(--btn-a), var(--btn-b)); color: var(--btn-text); box-shadow: 0 14px 34px -12px var(--btn-glow); }
    .own-btn.is-picked .own-sub { color: inherit; opacity: 0.85; }
    .own-btn.is-picked .own-ico { background-color: rgba(255, 255, 255, 0.22); color: inherit; }

    /* Вспышка «смены сцены» в момент переключения именинника */
    .flash {
      position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at var(--fx, 50%) var(--fy, 30%), var(--accent) 0%, transparent 52%);
      transform-origin: var(--fx, 50%) var(--fy, 30%); mix-blend-mode: screen;
    }
    .flash.go { animation: flash 0.85s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes flash {
      0%   { opacity: 0; transform: scale(0.35); }
      28%  { opacity: 0.34; }
      100% { opacity: 0; transform: scale(1.9); }
    }

    /* ─────────── Каркас ─────────── */
    .app {
      transition: opacity 0.26s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), filter 0.26s ease;
    }
    .app.is-leaving { opacity: 0.06; transform: translateY(6px) scale(0.99); }
    @media (hover: hover) { .app.is-leaving { filter: blur(6px); } }
    .app { z-index: 1; min-height: 100vh; min-height: 100dvh; padding-top: calc(env(safe-area-inset-top, 0px) + 28px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); }
    .app section { scroll-margin-top: 20px; }
    @media (hover: hover) {
      .btn:hover { filter: brightness(1.08); }
      .btn.btn-ghost:hover, .icon-btn:hover { border-color: var(--border-card); }
      .tabs .tab:hover, .seg .seg-btn:hover { color: var(--text); }
    }

    /* ─────────── Типографика ─────────── */
    .h-font { font-family: var(--font-heading); }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--text-muted); transition: color var(--morph); }
    .section-title, .sub-title {
      font-family: var(--font-heading); font-weight: var(--h-weight);
      letter-spacing: var(--h-tracking); line-height: 1.15;
      transition: font-size var(--morph), letter-spacing var(--morph);
    }
    .section-title { font-size: var(--h2-size); }
    .sub-title { font-size: var(--h3-size); }
    .hero-kicker, .tab-title, .tl-head, #location h3, #memo h3, .universal h4 {
      font-family: var(--font-heading); font-weight: var(--t-weight); letter-spacing: var(--h-tracking);
    }
    .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--text-muted); transition: color var(--morph); }
    .stat { font-size: 18px; font-weight: 500; }

    /* ─────────── Карточки ─────────── */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--card-radius);
      box-shadow: inset 0 1px 0 var(--card-hi), 0 0 var(--glow-size) -8px var(--glow-color), 0 22px 44px -30px rgba(0, 0, 0, 0.9);
      -webkit-backdrop-filter: blur(var(--card-blur)); backdrop-filter: blur(var(--card-blur));
      transition: background-color var(--morph), border-color var(--morph), border-radius var(--morph), box-shadow var(--morph), -webkit-backdrop-filter var(--morph), backdrop-filter var(--morph);
    }
    .inset {
      background-color: var(--bg-inset); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
      transition: background-color var(--morph), border-color var(--morph), border-radius var(--morph);
    }
    .icon-tile {
      display: inline-flex; align-items: center; justify-content: center; flex: none;
      width: 40px; height: 40px; border-radius: calc(var(--radius-sm) * 0.75);
      background-color: var(--bg-tile); border: 1px solid var(--border-card); color: var(--accent-text);
      transition: background-color var(--morph), border-color var(--morph), border-radius var(--morph), color var(--morph);
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      padding: 5px 10px; border-radius: var(--radius-pill);
      border: 1px solid var(--border-card); color: var(--accent-text);
      font-size: 11.5px; line-height: 1.2; white-space: nowrap;
      transition: border-color var(--morph), border-radius var(--morph), color var(--morph), background-color var(--morph);
    }
    .chip.chip-solid { background-color: var(--bg-tile); }
    i[data-lucide], svg.lucide { display: inline-block; width: 18px; height: 18px; flex: none; stroke-width: 1.75; }

    /* ─────────── Кнопки ─────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 0 18px; border-radius: var(--radius-btn);
      font-size: 15px; font-weight: 600; line-height: 1.2; text-align: center;
      user-select: none; -webkit-user-select: none;
      transition: transform 0.15s ease, opacity 0.2s ease, border-radius var(--morph), background-color var(--morph), border-color var(--morph), color var(--morph), box-shadow var(--morph), --btn-a var(--morph), --btn-b var(--morph);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: progress; }
    .btn.btn-primary {
      background-image: linear-gradient(120deg, var(--btn-a), var(--btn-b));
      color: var(--btn-text);
      box-shadow: 0 12px 28px -12px var(--btn-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn.btn-ghost { background-color: var(--bg-inset); border: 1px solid var(--border-soft); color: var(--text); }
    .btn.btn-grow { flex: 1 1 150px; }
    .btn.btn-map { padding: 0 10px; font-size: 14px; }
    @media (max-width: 359px) { .btn.btn-map i, .btn.btn-map svg { display: none; } }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; flex: none;
      width: 44px; height: 44px; border-radius: var(--radius-btn);
      background-color: var(--bg-inset); border: 1px solid var(--border-soft); color: var(--text-muted);
    }

    /* ─────────── Hero ─────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 14px; border-radius: var(--radius-pill);
      background-color: var(--bg-inset); border: 1px solid var(--border-card);
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em;
      transition: background-color var(--morph), border-color var(--morph), border-radius var(--morph);
    }
    button.badge { text-align: left; line-height: 1.45; cursor: pointer; }
    .badge-hint { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; transition: color var(--morph); }
    .badge .dot, .sync-status .dot {
      width: 6px; height: 6px; border-radius: 50%; flex: none;
      background-color: var(--accent); box-shadow: 0 0 10px var(--accent);
      transition: background-color var(--morph), box-shadow var(--morph);
    }
    .hero-title { font-family: var(--font-heading); font-weight: var(--h-weight); letter-spacing: var(--h-tracking); line-height: 1.04; }
    .hero-kicker { display: block; margin-bottom: 12px; font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--text-muted); transition: color var(--morph); }
    .hero-name {
      display: block; max-width: 100%; padding: 2px 0; overflow-wrap: anywhere;
      font-size: var(--h1-size);
      background-image: linear-gradient(100deg, var(--btn-a), var(--btn-b));

    <header id="hero"></header>
    <main>
      <section id="location" class="mt-14" aria-labelledby="locationTitle"></section>
      <section id="schedule" class="mt-14" aria-labelledby="scheduleTitle"></section>
      <section id="memo" class="mt-8" aria-label="Памятка гостя"></section>

  <!-- RSVP -->
  <dialog id="rsvpModal" class="sheet" aria-labelledby="rsvpTitle">
    <div class="sheet-body">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 id="rsvpTitle" class="section-title">Вы с нами?</h2>
          <p class="mt-2 text-sm muted leading-snug">Ответ можно поменять в любой момент — просто откройте эту форму ещё раз.</p>
        </div>
        <button class="icon-btn" data-action="close-modal" aria-label="Закрыть"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>

      <form id="rsvpForm" class="mt-5" novalidate>
        <label class="label" for="rsvpName">Имя</label>
        <input class="field mt-2" id="rsvpName" name="name" type="text" autocomplete="name" maxlength="60" placeholder="Имя">

        <fieldset class="mt-5">
          <legend class="label">Ваш ответ</legend>
          <div class="flex flex-col gap-2 mt-2">
            <label class="choice"><input type="radio" name="status" value="overnight"><span class="choice-card"><i data-lucide="bed-double" aria-hidden="true"></i><span>С ночёвкой</span></span></label>
            <label class="choice"><input type="radio" name="status" value="day"><span class="choice-card"><i data-lucide="sun" aria-hidden="true"></i><span>Без ночёвки</span></span></label>
            <label class="choice"><input type="radio" name="status" value="no"><span class="choice-card"><i data-lucide="frown" aria-hidden="true"></i><span>Не смогу</span></span></label>
            <label class="choice"><input type="radio" name="status" value="maybe"><span class="choice-card"><i data-lucide="dices" aria-hidden="true"></i><span>Как карта ляжет</span></span></label>
          </div>
        </fieldset>

        <fieldset class="mt-5" id="rsvpDatesBox" hidden>
          <legend class="label">Когда сможете · можно отметить несколько</legend>
          <div class="flex flex-col gap-2 mt-2" id="rsvpDates"></div>
        </fieldset>

        <label class="label block mt-5" for="rsvpComment">Комментарий</label>
        <textarea class="field mt-2" id="rsvpComment" name="comment" rows="3" maxlength="400" placeholder="Аллергии, «+1», во сколько приедете…"></textarea>

        <p class="form-error mt-3" id="rsvpError" role="alert" hidden></p>
        <button class="btn btn-primary w-full mt-5" type="submit"><span class="lbl">Отправить ответ</span></button>
      </form>

      <div id="rsvpDone" class="mt-6" hidden>
        <span class="icon-tile"><i data-lucide="check" aria-hidden="true"></i></span>
        <h3 class="sub-title mt-4" id="rsvpDoneTitle"></h3>
        <p class="mt-2 text-sm muted leading-relaxed" id="rsvpDoneText"></p>
        <button class="btn btn-primary w-full mt-6" data-action="close-modal">Готово</button>
      </div>
    </div>
  </dialog>

  <!-- Добавить свой пункт в «Что будет» -->
  <dialog id="extraModal" class="sheet" aria-labelledby="extraTitleH">
    <div class="sheet-body">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 id="extraTitleH" class="section-title">Что добавим?</h2>
          <p class="mt-2 text-sm muted leading-snug">Один пункт от каждого гостя. Под ним будет ваше имя.</p>
        </div>
        <button class="icon-btn" data-action="close-modal" aria-label="Закрыть"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <form id="extraForm" class="mt-5" novalidate>
        <label class="label" for="extraText">Что будет</label>
        <input class="field mt-2" id="extraText" name="title" type="text" maxlength="40" autocomplete="off" placeholder="Например: караоке">
        <label class="label block mt-5" for="extraName">Имя</label>
        <input class="field mt-2" id="extraName" name="name" type="text" maxlength="40" autocomplete="name" placeholder="Имя">
        <p class="form-error mt-3" id="extraError" role="alert" hidden></p>
        <button class="btn btn-primary w-full mt-5" type="submit"><span class="lbl">Добавить</span></button>
      </form>
    </div>
  </dialog>

      function uniPanelHtml(host, opt) {

        return `

      function universalCard(host) {
        const opts = uniOptions(host);
        if (!opts.length) return '';
        let index = opts.findIndex((o) => o.id === state.uni);
        if (index < 0) index = 0;
        return `
          <article class="card universal p-5 mt-4">
            <h3 class="sub-title">Универсальные подарки</h3>
            <div class="uni-tabs mt-4" role="tablist" aria-label="Вариант подарка" style="--n:${opts.length};--i:${index}">
              <span class="uni-thumb" aria-hidden="true"></span>
              ${opts.map((o, i) => `<button class="uni-tab ${uniPicked(o.id) ? 'is-picked' : ''}" role="tab" aria-selected="${i === index}" data-action="uni" data-uni="${o.id}">${icon(o.icon)}<span>${esc(o.tab)}</span></button>`).join('')}
            </div>
            <p class="uni-hint mono" id="uniHint" aria-live="polite"></p>
            <div class="uni-panel mt-5" id="uniPanel" role="tabpanel">${uniPanelHtml(host, opts[index])}</div>
            ${host.universal.own ? `
            <button class="own-btn ${uniPicked('own') ? 'is-picked' : ''}" data-action="uni-own">
              <span class="own-ico">${icon('wand-sparkles')}</span>
              <span class="own-text"><span class="own-main">${esc(host.universal.own)}</span><span class="own-sub mono" id="ownSub">${esc(uniPicked('own') ? 'выбрано ✓' : (host.universal.ownText || ''))}</span></span>
            </button>` : ''}
          </article>`;
      }
      /* Выбор универсального подарка: без лимита, подтверждается вторым нажатием на ту же плитку */
      const uniKey = (id) => state.host + ':' + id;
      const uniPicked = (id) => Boolean(state.uniPicks[uniKey(id)]);
      const uniFromKey = (key) => {
        const parts = String(key).split(':'), host = D.hosts[parts[0]];
        let opt = host ? uniOptions(host).find((o) => o.id === parts[1]) : null;
        if (!opt && host && parts[1] === 'own' && host.universal && host.universal.own) opt = { id: 'own', title: host.universal.own };
        return opt ? { host: host, opt: opt } : null;
      };
      const uniArm = { key: '', timer: 0 };
      function disarmUni() {
        clearTimeout(uniArm.timer);
        uniArm.key = '';
        const hint = $('#uniHint');
        if (hint) hint.classList.remove('show');
        $$('.uni-tab.is-armed, .own-btn.is-armed').forEach((tab) => tab.classList.remove('is-armed'));
        ownSub();
      }
      /* подпись под «Что-то своё»: обычная, «выбрано» или предупреждение перед подтверждением */
      function ownSub(text) {
        const el = $('#ownSub');
        if (!el) return;
        const U = D.hosts[state.host].universal || {};
        el.textContent = text || (uniPicked('own') ? 'выбрано ✓' : (U.ownText || ''));
      }
      function tapOwn(el) {
        const key = uniKey('own');
        if (!uniFromKey(key)) return;
        if (uniArm.key === key) { disarmUni(); toggleUniPick(el, key); ownSub(); return; }
        disarmUni();
        uniArm.key = key;
        el.classList.add('is-armed');
        ownSub(uniPicked('own') ? 'нажмите ещё раз, чтобы отменить' : 'нажмите ещё раз, чтобы подтвердить');
        uniArm.timer = setTimeout(disarmUni, 4000);
      }
      function tapUni(el) {
        const id = el.dataset.uni, key = uniKey(id);
        if (!uniFromKey(key)) return;
        if (uniArm.key === key) { disarmUni(); toggleUniPick(el, key); return; }   // второе нажатие — подтверждение
        disarmUni();
        selectUni(id);
        uniArm.key = key;
        el.classList.add('is-armed');
        const hint = $('#uniHint');
        if (hint) {
          hint.textContent = uniPicked(id) ? 'Нажмите ещё раз, чтобы отменить выбор' : 'Нажмите ещё раз, чтобы подтвердить';
          hint.classList.add('show');
        }
        uniArm.timer = setTimeout(disarmUni, 4000);
      }
      function toggleUniPick(el, key) {
        const found = uniFromKey(key);
        const guest = state.rsvp && state.rsvp.name ? state.rsvp.name : '';
        const was = state.uniPicks[key];
        if (was) {
          delete state.uniPicks[key];
          store.set('uniPicks', state.uniPicks);
          el.classList.remove('is-picked');
          toast('Выбор отменён');
          if (was.notified) notify('↩️ Универсальный подарок отменён\nКому: ' + found.host.name + '\nЧто: ' + found.opt.title + '\nКто: ' + (guest || 'гость'));
          return;
        }
        /* участие подтверждено — сразу шлём уведомление; если нет — отправим вместе с ответом на приглашение */
        state.uniPicks[key] = { at: Date.now(), notified: Boolean(guest) };
        store.set('uniPicks', state.uniPicks);
        el.classList.add('is-picked');
        try { if (navigator.vibrate) navigator.vibrate(20); } catch (e) {}
        if (guest) {
          notify('🎁 Универсальный подарок\nКому: ' + found.host.name + '\nЧто: ' + found.opt.title + '\nКто: ' + guest);
          toast('Выбор подтверждён ✓');
        } else {
          toast('Выбор отмечен ✓ Подтвердите участие — и мы узнаем, от кого подарок');
        }
      }
      function selectUni(id) {
        const host = D.hosts[state.host];
        const opts = uniOptions(host);
        const index = opts.findIndex((o) => o.id === id);
        const panel = $('#uniPanel'), tabs = $('.uni-tabs');
        if (index < 0 || !panel || !tabs || state.uni === id) return;
        state.uni = id;
        tabs.style.setProperty('--i', index);
        $$('.uni-tab', tabs).forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.uni === id)));
        /* плавно меняем высоту панели под новое содержимое */
        const from = panel.offsetHeight;
        panel.style.height = 'auto';
        panel.innerHTML = uniPanelHtml(host, opts[index]);
        paintIcons();
        const to = panel.offsetHeight;
        panel.style.height = from + 'px';
        void panel.offsetHeight;
        panel.style.height = to + 'px';
        clearTimeout(panel._t);
        panel._t = setTimeout(() => { panel.style.height = 'auto'; }, 500);
      }

      const LINK_NAMES = [[/ozon\./i, 'Ozon'], [/avito\./i, 'Avito'], [/wildberries\.|wb\.ru/i, 'Wildberries'], [/market\.yandex\./i, 'Яндекс Маркет'], [/laroutine/i, 'La Routine']];
      function giftLinks(gift) {
        const list = (Array.isArray(gift.links) ? gift.links : [gift.link]).filter(Boolean);
        return list.map((url, i) => {
          const hit = LINK_NAMES.find((pair) => pair[0].test(url));
          const name = (hit ? hit[1] : 'ссылка') + (list.length > 1 ? ' · ' + (i + 1) : '');
          return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)}${icon('external-link')}</a>`;
        });
      }

      function giftCard(gift, index, all) {
        const qty = giftQty(gift), taken = takenCount(gift);
        const booked = taken >= qty;                 // свободных мест не осталось
        const mine = Boolean(mySlot(gift));
        const num = String(index + 1).padStart(2, '0') + ' / ' + String(all.length).padStart(2, '0');
        const links = giftLinks(gift);
        const status = qty > 1 ? `забронировано ${taken} / ${qty}` : (booked ? 'забронирован' : 'свободен');
        let action;
        if (mine) {
          action = `<button class="booked-badge" data-action="unreserve" data-gift="${esc(gift.id)}">${icon('check')}<span class="lbl">Уже забронировано</span><span class="booked-undo">это вы · отменить</span></button>`;
        } else if (!booked) {
          action = `<button class="btn btn-primary w-full" data-action="reserve" data-gift="${esc(gift.id)}">${icon('gift')}<span class="lbl">Забронировать подарок</span></button>`;
        } else {
          action = `<div class="booked-badge">${icon('lock')}<span>Уже забронировано</span></div>`;
        }
        return `
          <article class="card gift p-5 ${booked || mine ? 'is-booked' : ''} ${qty > 1 && taken > 0 && !booked ? 'is-partial' : ''}">
            <div class="gift-dim">
              <div class="gift-meta mono"><span>${num}</span><span class="gift-status">${status}</span></div>
              <h4 class="sub-title mt-3">${esc(gift.title)}</h4>
              ${gift.text ? `<p class="mt-2 text-sm muted leading-snug">${esc(gift.text)}</p>` : ''}
              <dl class="gift-spec mt-4">
                ${gift.budget ? `<div><dt>Цена</dt><dd>${esc(gift.budget)}</dd></div>` : ''}
                ${links.length ? `<div><dt>Где смотреть</dt><dd class="gift-links">${links.join('')}</dd></div>` : ''}
              </dl>
            </div>
            <div class="mt-2">${action}</div>
          </article>`;
      }

      function renderWishBody(animate = true) {
        const body = $('#wishBody');
        if (!body) return;
        disarmUni();
        const host = D.hosts[state.host];
        const gifts = host.gifts || [];
        const free = gifts.filter((g) => !isFull(g)).length;
        const list = gifts.length ? `
            <div class="flex items-center justify-between gap-3 flex-wrap">
              <h3 class="sub-title">Идеи подарков</h3>
              <span class="chip mono">свободно ${free} из ${gifts.length}</span>
            </div>
            ${gifts.map((g, i, all) => {
              const head = g.category && (i === 0 || all[i - 1].category !== g.category)
                ? `<h4 class="cat-title">${esc(g.category)}</h4>` : '';
              return head + giftCard(g, i, all);
            }).join('')}` : `
            <div class="card p-5 empty-note">
              <span class="icon-tile mx-auto">${icon('hourglass')}</span>

        body.innerHTML = `
          <div class="flex flex-col gap-4 ${animate ? 'swap-in' : ''}">
            ${list}
            ${universalCard(host)}
          </div>`;
        paintIcons();
        armReveal();
      }

      function renderFooter() {
        const c = D.contact || {};
        $('#footer').innerHTML = `
          <div class="hairline"></div>
          <p class="mt-6 text-sm muted leading-relaxed">${esc(D.footerText)}</p>
          ${c.url ? `<a class="btn btn-ghost w-full mt-4" href="${esc(c.url)}" target="_blank" rel="noopener">${icon('send')}<span>${esc(c.label || 'Написать организаторам')}</span></a>` : ''}
          <p class="sync-status mono mt-6"><span class="dot"></span><span>${cloud.on ? 'брони обновляются на всех телефонах' : 'локальный режим: брони видны только на этом устройстве'}</span></p>`;
      }

      const noMotion = Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      /* ── Появление блоков при прокрутке. Каждая секция проявляется один раз:
         после этого перерисованные карточки (бронь, смена именинника) больше не прячутся и не «прыгают» ── */
      const revealSeen = {};
      const revealKey = (el) => { const box = el.closest('section, footer'); return box ? box.id : ''; };
      const revealIO = ('IntersectionObserver' in window) && !noMotion ? new IntersectionObserver((entries) => {
        let order = 0;
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          revealIO.unobserve(el);
          revealSeen[revealKey(el)] = true;
          el.style.setProperty('--rv-d', Math.min(order++, 5) * 70 + 'ms');
          el.classList.add('rv-in');
          if (el.classList.contains('card')) {
            el.classList.add('shine');
            setTimeout(() => el.classList.remove('shine'), 2400);
          }
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 }) : null;
      document.addEventListener('animationend', (ev) => {
        if (ev.animationName === 'rv-in' && ev.target.classList) ev.target.classList.remove('rv', 'rv-in');
      });
      function armReveal() {
        if (!revealIO) return;
        const fold = window.innerHeight * 0.94;
        $$('main .card, main .section-title, main .house-list > li, main .cat-title, #footer > *').forEach((el) => {
          if (el.dataset.rv) return;
          el.dataset.rv = '1';
          if (revealSeen[revealKey(el)]) return;
          if (el.getBoundingClientRect().top < fold) { revealSeen[revealKey(el)] = true; return; }
          el.classList.add('rv');
          revealIO.observe(el);
        });
      }

      /* ── Смена именинника = смена сцены ── */
      let booted = false;
      let morphTimer = 0;
      const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

      function applyTheme(n) {
        document.body.setAttribute('data-theme', String(n));
        const meta = $('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', n === 1 ? '#080412' : '#09090B');
      }

      function setHost(value, ev) {
        const next = Number(value) === 2 ? 2 : 1;
        const changed = next !== state.host;
        state.host = next;
        document.documentElement.setAttribute('data-host', String(next));
        $$('[data-action="host"]').forEach((btn) => btn.setAttribute('aria-pressed', String(Number(btn.dataset.host) === next)));

        if (!booted) { applyTheme(next); renderWishBody(false); return; }
        if (!changed) return;

        try {
          const url = new URL(window.location.href);
          url.searchParams.set('for', String(next));
          window.history.replaceState(null, '', url);
        } catch (e) {}

        if (reduceMotion.matches) { applyTheme(next); renderWishBody(false); return; }

        /* 1) контент уходит в дымку, 2) в этот момент разом меняются шрифты, цвета и список,
           3) контент проявляется уже в новой теме, а фон перетекает чуть дольше */
        const app = $('.app');
        app.classList.add('is-leaving');
        const flash = $('#flash');
        if (ev && typeof ev.clientX === 'number' && (ev.clientX || ev.clientY)) {
          flash.style.setProperty('--fx', ev.clientX + 'px');
          flash.style.setProperty('--fy', ev.clientY + 'px');
        }
        flash.classList.remove('go');
        void flash.offsetWidth;
        flash.classList.add('go');

        clearTimeout(morphTimer);
        morphTimer = setTimeout(() => {
          applyTheme(state.host);
          renderWishBody(false);
          requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('is-leaving')));
        }, 260);
      }

      /* ── Бронь подарка ── */
      const LIMIT_TOAST = () => limitHint() + ' Чтобы выбрать другой, сначала отмените свою бронь.';

      async function setReservation(giftId, want, btn) {
        const found = findGift(giftId);
        if (!found) return;
        if (want && limits.max && usedBy(found.host.name) >= limits.max) { toast(LIMIT_TOAST()); return; }
        if (btn) {
          btn.disabled = true;
          const lbl = $('.lbl', btn);
          if (lbl) lbl.textContent = want ? 'Бронируем…' : 'Отменяем…';
        }
        const guest = state.rsvp && state.rsvp.name ? state.rsvp.name : 'гость не представился';
        try {
          const gift = found.gift;
          let countText = '';
          if (cloud.on) {
            const rec = await cloud.pull();          // свежие данные прямо перед записью
            const res = rec.reservations;
            const mine = mySlot(gift, res);
            let problem = '';
            if (want) {
              const freeKey = slotKeys(gift).find((k) => !res[k]);
              if (mine) { /* уже забронировано с этого телефона */ }
              else if (!freeKey) problem = 'taken';
              else if (limits.max && usedBy(found.host.name) >= limits.max) problem = 'limit';
              else {
                res[freeKey] = { by: deviceId, host: found.host.name, gift: gift.title, guest: guest, at: new Date().toISOString() };
                await cloud.push(rec);
              }
            } else if (mine) {
              delete res[mine];
              await cloud.push(rec);
            }
            state.reservations = res;
            store.set('reservations', state.reservations);
            renderWishBody(false);
            if (problem) {
              toast(problem === 'limit' ? LIMIT_TOAST() : 'Этот подарок только что забронировал другой гость');
              return;
            }
          } else {
            const mine = mySlot(gift);
            if (want) {
              const freeKey = slotKeys(gift).find((k) => !state.reservations[k]);
              if (!mine && freeKey) state.reservations[freeKey] = { mine: true, at: Date.now() };
            } else if (mine) {
              delete state.reservations[mine];
            }
            store.set('reservations', state.reservations);
            renderWishBody(false);
          }
          if (giftQty(gift) > 1) countText = ' (' + takenCount(gift) + ' из ' + giftQty(gift) + ')';
          toast(want ? 'Подарок забронирован за вами. Спасибо!' : 'Бронь отменена — подарок снова свободен');
          notify((want ? '🎁 Подарок забронирован' : '↩️ Бронь отменена') +
            '\nКому: ' + found.host.name + '\nЧто: ' + found.gift.title + countText + '\nКто: ' + guest);
        } catch (err) {
          console.warn(err);
          renderWishBody(false);
          const code = String(err && err.message || '').match(/\b(40[0-9])\b/);
          toast(code ? 'Сервер броней отклонил запрос (ошибка ' + code[1] + '). Проверьте ключ JSONBin'
            : 'Нет связи с сервером броней — бронь не сохранилась. Попробуйте ещё раз');
        }
      }

      /* ── Модальные окна ── */
      function openModal(dialog) {
        if (typeof dialog.showModal === 'function') dialog.showModal();
        else dialog.setAttribute('open', '');
        document.documentElement.classList.add('modal-open');
      }
      function closeModal(dialog) {
        if (!dialog) return;
        if (typeof dialog.close === 'function') dialog.close();
        else dialog.removeAttribute('open');
        document.documentElement.classList.remove('modal-open');
      }
      $$('dialog').forEach((dialog) => dialog.addEventListener('close', () => {
        document.documentElement.classList.remove('modal-open');
        document.body.appendChild($('#toast'));
      }));

      function openQr() {
        const host = D.hosts[state.host];
        const U = host.universal || {};
        const img = $('#qrImg'), empty = $('#qrEmpty');
        const showEmpty = () => {
          img.hidden = true;
          empty.hidden = false;
          $('#qrPath').textContent = '';
        };
        $('#qrSub').textContent = 'USDT · сеть ' + (U.usdtNetwork || '') + ' · получатель: ' + host.name;
        $('#qrUid').textContent = U.usdtAddress || '';
        img.hidden = false;
        empty.hidden = true;
        img.onerror = showEmpty;
        if (U.qrImage) img.src = U.qrImage; else showEmpty();
        openModal($('#qrModal'));
      }

      /* ── Свой пункт в «Что будет»: не больше одного с телефона ── */
      const extraForm = $('#extraForm');
      const extraError = (msg) => { const el = $('#extraError'); el.textContent = msg; el.hidden = !msg; };

      async function saveExtra(entry) {
        if (cloud.on) {
          const rec = await cloud.pull();
          if (entry) {
            if (rec.extras[deviceId]) return 'already';
            rec.extras[deviceId] = entry;
          } else {
            delete rec.extras[deviceId];
          }
          await cloud.push(rec);
          state.extras = rec.extras;
        } else if (entry) {
          state.extras[deviceId] = entry;
        } else {
          delete state.extras[deviceId];
        }
        store.set('extras', state.extras);
        return 'ok';
      }

      extraForm.addEventListener('input', () => extraError(''));
      extraForm.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const title = String(extraForm.elements.title.value || '').trim().replace(/\s+/g, ' ');
        const name = String(extraForm.elements.name.value || '').trim().replace(/\s+/g, ' ');
        if (!title) { extraError('Напишите, что добавить.'); extraForm.elements.title.focus(); return; }
        if (!name) { extraError('Напишите имя — оно будет под пунктом.'); extraForm.elements.name.focus(); return; }
        if (state.extras[deviceId]) { extraError('Вы уже добавили свой пункт. Сначала уберите его.'); return; }
        const submit = $('button[type="submit"]', extraForm);
        submit.disabled = true;
        try {
          const result = await saveExtra({ title: title, name: name, at: new Date().toISOString() });
          renderHouse();
          if (result === 'already') { extraError('Вы уже добавили свой пункт. Сначала уберите его.'); return; }
          closeModal($('#extraModal'));
          extraForm.reset();
          toast('Добавили: ' + title);
          notify('➕ Новый пункт в «Что будет»\nЧто: ' + title + '\nКто: ' + name);
        } catch (err) {
          console.warn(err);
          extraError('Нет связи с сервером — пункт не сохранился. Попробуйте ещё раз.');
        } finally {
          submit.disabled = false;
        }
      });

      /* ── RSVP ── */
      const rsvpForm = $('#rsvpForm');
      function updateRsvpButton() {
        const lbl = $('#rsvpBtn .lbl');
        if (lbl) lbl.textContent = state.rsvp ? 'Ответ отправлен ✓ Изменить' : 'Подтвердить участие';
      }
      const dateGroups = Array.isArray(D.rsvpDates) ? D.rsvpDates : [];
      const dateDays = dateGroups.reduce((all, g) => all.concat(g.days || []), []);
      const datesSummary = (ids) => dateDays.filter((d) => ids.indexOf(d.id) !== -1).map((d) => d.short || d.label).join(', ');

      function renderRsvpDates() {
        $('#rsvpDates').innerHTML = dateGroups.map((g) => `
          <div class="inset p-4">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <span class="date-title">${esc(g.title)}</span>
              ${g.note ? `<span class="chip mono">${esc(g.note)}</span>` : ''}
            </div>
            <div class="date-days mt-3">
              ${(g.days || []).map((d) => `<label class="choice"><input type="checkbox" name="dates" value="${esc(d.id)}"><span class="choice-card compact"><span>${esc(d.label)}</span></span></label>`).join('')}
            </div>
          </div>`).join('');
      }
      /* Даты не спрашиваем у тех, кто точно не сможет */
      function syncDatesBox() {
        const status = (rsvpForm.elements.status || {}).value;
        $('#rsvpDatesBox').hidden = !dateGroups.length || status === 'no';
      }
      renderRsvpDates();
      rsvpForm.addEventListener('change', syncDatesBox);

      function openRsvp() {
        rsvpForm.hidden = false;
        $('#rsvpDone').hidden = true;
        $('#rsvpError').hidden = true;
        if (state.rsvp) {
          rsvpForm.elements.name.value = state.rsvp.name || '';
          rsvpForm.elements.comment.value = state.rsvp.comment || '';
          const radio = $(`input[name="status"][value="${state.rsvp.status}"]`, rsvpForm);
          if (radio) radio.checked = true;
          const picked = Array.isArray(state.rsvp.dates) ? state.rsvp.dates : [];
          $$('input[name="dates"]', rsvpForm).forEach((box) => { box.checked = picked.indexOf(box.value) !== -1; });
        }
        syncDatesBox();
        openModal($('#rsvpModal'));
      }
      function showRsvpError(message) {
        const el = $('#rsvpError');
        el.textContent = message;
        el.hidden = false;
      }

      rsvpForm.addEventListener('input', () => { $('#rsvpError').hidden = true; });

      rsvpForm.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const data = new FormData(rsvpForm);
        const name = String(data.get('name') || '').trim();
        const status = String(data.get('status') || '');
        const comment = String(data.get('comment') || '').trim();
        if (!name) { showRsvpError('Напишите имя — иначе мы не поймём, от кого ответ.'); rsvpForm.elements.name.focus(); return; }
        if (!STATUS_LABELS[status]) { showRsvpError('Выберите один из вариантов ответа.'); return; }
        const dates = status === 'no' ? [] : data.getAll('dates').map(String);
        if (status !== 'no' && dateGroups.length && !dates.length) { showRsvpError('Отметьте хотя бы одну дату, когда сможете.'); return; }
        const datesText = datesSummary(dates);
        $('#rsvpError').hidden = true;

        const submit = $('button[type="submit"]', rsvpForm);
        const lbl = $('.lbl', submit);
        submit.disabled = true;
        lbl.textContent = 'Отправляем…';

        const entry = { name, status, dates, comment, at: Date.now() };
        let cloudFailed = false;
        if (cloud.on) {
          try {
            const rec = await cloud.pull();
            const was = Boolean(rec.rsvp[deviceId]);
            rec.rsvp[deviceId] = { name: name, status: STATUS_LABELS[status], dates: datesText, comment: comment, at: new Date().toISOString(), updated: was };
            await cloud.push(rec);
          } catch (err) {
            console.warn(err);
            cloudFailed = true;
          }
        }
        submit.disabled = false;
        lbl.textContent = 'Отправить ответ';

        if (cloudFailed && !telegramOn) {
          showRsvpError('Ответ не отправился: нет связи с сервером. Проверьте интернет и нажмите «Отправить ответ» ещё раз.');
          return;
        }

        state.rsvp = entry;
        store.set('rsvp', entry);
        updateRsvpButton();
        const pendingUni = Object.keys(state.uniPicks).filter((key) => !state.uniPicks[key].notified && uniFromKey(key));
        const uniText = pendingUni.map((key) => { const f = uniFromKey(key); return f.host.name + ' — ' + f.opt.title; }).join('; ');
        pendingUni.forEach((key) => { state.uniPicks[key].notified = true; });
        if (pendingUni.length) store.set('uniPicks', state.uniPicks);
        notify('✅ Ответ на приглашение\nИмя: ' + name + '\nОтвет: ' + STATUS_LABELS[status] + (datesText ? '\nДаты: ' + datesText : '') + (uniText ? '\nУниверсальные подарки: ' + uniText : '') + (comment ? '\nКомментарий: ' + comment : ''));

        const done = {
          overnight: ['Ждём вас с ночёвкой!', 'Спальное место за вами.'],
          day: ['Ждём вас в гости!', 'Записали: без ночёвки. Если передумаете и останетесь — просто обновите ответ.'],
          no: ['Жаль, будем скучать', 'Спасибо, что предупредили. Если планы поменяются — обновите ответ, место найдётся.'],
          maybe: ['Держим за вас место', 'Записали: как карта ляжет. Когда станет понятнее — просто обновите ответ.']
        }[status];
        $('#rsvpDoneTitle').textContent = done[0];
        $('#rsvpDoneText').textContent = done[1] + (status === 'no' ? '' : ' Итоговую дату объявим, когда соберём ответы.');
        rsvpForm.hidden = true;
        $('#rsvpDone').hidden = false;
      });

      /* ── Все клики по кнопкам с data-action ── */
      const actions = {
        host(el, ev) { setHost(el.dataset.host, ev); },
        async 'copy-address'(el) {
          const ok = await copyText(D.location.address);
          if (ok) swapLabel(el, 'Скопировано! ✓');
          toast(ok ? 'Адрес скопирован — вставляйте в навигатор' : 'Не получилось скопировать. Выделите адрес вручную');
        },
        async 'copy-uid'(el) {
          const U = D.hosts[state.host].universal || {};
          const ok = await copyText(String(U.usdtAddress || ''));
          if (ok) swapLabel(el, 'Скопировано! ✓');
          toast(ok ? 'Адрес USDT скопирован' : 'Не получилось скопировать. Выделите адрес вручную');
        },
        'show-qr'() { openQr(); },
        uni(el) { tapUni(el); },
        'uni-own'(el) { tapOwn(el); },
        'extra-open'() {
          extraError('');
          if (!extraForm.elements.name.value && state.rsvp && state.rsvp.name) extraForm.elements.name.value = state.rsvp.name;
          openModal($('#extraModal'));
        },
        async 'extra-remove'(el) {
          el.disabled = true;
          try {
            await saveExtra(null);
            renderHouse();
            toast('Ваш пункт убран — можно добавить другой');
          } catch (err) {
            console.warn(err);
            el.disabled = false;
            toast('Нет связи с сервером — не получилось убрать. Попробуйте ещё раз');
          }
        },
        'open-rsvp'() { openRsvp(); },
        'close-modal'(el) { closeModal(el.closest('dialog')); },
        reserve(el) { setReservation(el.dataset.gift, true, el); },
        unreserve(el) {
          /* Отмена в два касания, чтобы не снять бронь случайно */
          if (el.dataset.armed) { setReservation(el.dataset.gift, false, el); return; }
          el.dataset.armed = '1';
          el.classList.add('is-armed');
          $('.lbl', el).textContent = 'Отменить бронь?';
          $('.booked-undo', el).textContent = 'нажмите ещё раз';
          setTimeout(() => {
            if (!el.isConnected) return;
            delete el.dataset.armed;
            el.classList.remove('is-armed');
            $('.lbl', el).textContent = 'Уже забронировано';
            $('.booked-undo', el).textContent = 'это вы · отменить';
          }, 3500);
        }
      };

      document.addEventListener('click', (ev) => {
        const target = ev.target;
        if (!(target instanceof Element)) return;
        const el = target.closest('[data-action]');
        if (el) {
          const fn = actions[el.dataset.action];
          if (fn) fn(el, ev);
          return;
        }
        if (target.matches('dialog.sheet')) closeModal(target);   // клик по затемнению
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') syncFromCloud();
      });

      /* ── Шрифты обеих тем грузим сразу ── */
      if (document.fonts && document.fonts.load) {
        ['500 1em Unbounded', '700 1em Unbounded', '400 1em Inter', '600 1em Inter',
         '400 1em Manrope', '700 1em Manrope', '800 1em Manrope', '400 1em "JetBrains Mono"', '700 1em "JetBrains Mono"']
          .forEach((f) => { document.fonts.load(f, 'Двойной ДР Aa 0123').catch(() => {}); });
      }

      /* ── Диагностика связи с JSONBin: откройте сайт с ?test=1 в конце ссылки ── */
      if (new URLSearchParams(window.location.search).get('test') === '1') {
        const box = document.createElement('pre');
        box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;margin:0;padding:12px;max-height:70vh;overflow:auto;white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace;background:#000;color:#9f9;border:1px solid #9f9;border-radius:8px';
        document.body.appendChild(box);
        const log = (t) => { box.textContent += t + '\n'; };
        const check = async (title, url, options) => {
          const t0 = performance.now();
          try {
            const res = await fetchWithTimeout(url, options, 25000);
            const body = (await res.text()).slice(0, 90);
            log(title + ': ' + res.status + ' за ' + Math.round(performance.now() - t0) + ' мс · ' + body);
          } catch (err) {
            log(title + ': ОШИБКА за ' + Math.round(performance.now() - t0) + ' мс · ' + (err && err.name) + ' ' + (err && err.message));
          }
        };
        (async () => {
          log('Проверка связи… (до 25 секунд на каждый шаг)');
          log('Ключ заполнен: ' + (cloud.on ? 'да' : 'нет') + ' · заголовок: ' + D.JSONBIN_KEY_HEADER);
          await check('1. Без ключа', cloud.url + '/latest', { cache: 'no-store' });
          await check('2. С ключом', cloud.url + '/latest', { headers: cloud.headers(), cache: 'no-store' });
          await check('3. С ключом и X-Bin-Meta', cloud.url + '/latest', { headers: cloud.headers({ 'X-Bin-Meta': 'false' }), cache: 'no-store' });
          await check('4. Telegram', 'https://api.telegram.org/', { cache: 'no-store', mode: 'no-cors' });
          log('Готово. Сделайте скриншот этого окна.');
        })();
      }

      /* ── Старт ── */
      const forParam = new URLSearchParams(window.location.search).get('for');
      renderHero();
      renderLocation();
      renderHouse();
      renderMemo();
      renderWishlist();
      renderFooter();
      setHost(forParam === '2' ? 2 : 1);
      booted = true;
      updateRsvpButton();
      paintIcons();
      armReveal();
      document.addEventListener('DOMContentLoaded', paintIcons);
      window.addEventListener('load', paintIcons);
      syncFromCloud();
    })();
  </script>
</body>
</html>
